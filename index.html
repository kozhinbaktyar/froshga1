<!DOCTYPE html>
<html lang="ckb" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARDUEXEL BUSINESS</title>
<style>
:root{--bg:#f4f6fa;--cd:#fff;--tx:#1b2430;--mu:#6b7686;--pr:#1d6fe0;--bd:#dde3ec;--g:#16875a;--r:#c8372d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10151c;--cd:#1a222d;--tx:#e8edf4;--mu:#92a0b3;--pr:#4a95ff;--bd:#2c3746;--g:#3ccb8c;--r:#ff6b60;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Noto Naskh Arabic",Tahoma,"Segoe UI",sans-serif}
header{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--cd);border-bottom:1px solid var(--bd);flex-wrap:wrap}.sp{flex:1}
.badge{font-size:12px;color:var(--mu)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--cd);border-bottom:1px solid var(--bd)}
nav a{padding:6px 14px;border-radius:20px;white-space:nowrap;cursor:pointer;color:var(--mu)}nav a.on{background:var(--pr);color:#fff}
main{padding:12px;max-width:1200px;margin:auto}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
input,select,textarea,button{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--tx);max-width:100%}
input,select,textarea{width:100%;margin:3px 0}button{cursor:pointer}.pri{background:var(--pr);color:#fff;border-color:var(--pr)}.dng{color:var(--r)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.bar input,.bar select{width:auto;flex:1;min-width:120px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th{color:var(--mu);font-weight:600}
.kps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kp{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px}.kp small{color:var(--mu);display:block}.kp b{font-size:18px}.kp.g b{color:var(--g)}.kp.r b{color:var(--r)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{flex:1 1 130px;text-align:right}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}.dl{width:100%;max-width:460px;max-height:90vh;overflow:auto;margin:0}
.low{color:var(--r);font-weight:700}small{color:var(--mu)}label{display:block;color:var(--mu);font-size:13px;margin-top:6px}
#prt{display:none}
@media print{body>*:not(#prt){display:none!important}#prt{display:block;color:#000;background:#fff;font-size:13px}#prt table{width:100%}.noprt{display:none}}
</style></head><body>
<div id="app"></div><div id="m"></div><div id="m2"></div><div id="prt"></div>
<script>
const K='arduexel_biz';
const ALL=['dash','pos','prod','buy','cust','exp','rep','usr','set'];
const NAMES={dash:'داشبۆرد',pos:'فرۆشتن',prod:'کاڵاکان',buy:'کڕین',cust:'کڕیار و قەرز',exp:'خەرجی',rep:'ڕاپۆرت',usr:'کارمەندان',set:'ڕێکخستن'};
const ROLES={admin:['بەڕێوەبەر',ALL],cashier:['کاشێر',['pos','cust']],stock:['کۆگاوان',['dash','prod','buy']],acc:['ژمێریار',['dash','exp','rep','cust']]};
let db=null;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
db=db||{products:[],suppliers:[],customers:[],sales:[],purchases:[],expenses:[],payments:[],users:[{id:1,name:'بەڕێوەبەر',pin:'1234',role:'admin'}],set:{shop:'ARDUEXEL BUSINESS',cur:'IQD',sync:''},seq:2};
const S={user:null,tab:'dash',cart:[],disc:0,paid:'',cid:0,inst:0,pl:[],psup:0};const V={};
const g=i=>document.getElementById(i),val=i=>g(i).value.trim(),num=i=>+g(i).value||0;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(+n||0).toLocaleString('en-US'),money=n=>fmt(n)+' '+db.set.cur;
const tz=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString(),today=()=>tz().slice(0,10);
const nid=()=>db.seq++;
const P=i=>db.products.find(p=>p.id==i),C=i=>db.customers.find(p=>p.id==i),SP=i=>db.suppliers.find(p=>p.id==i);
const net=s=>s.total-s.disc;
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const custBal=i=>sum(db.sales.filter(s=>s.cid==i),s=>net(s)-s.paid)-sum(db.payments.filter(p=>p.k=='c'&&p.o==i),p=>p.amt);
const supBal=i=>sum(db.purchases.filter(s=>s.sid==i),s=>s.total-s.paid)-sum(db.payments.filter(p=>p.k=='s'&&p.o==i),p=>p.amt);
const can=t=>S.user&&(S.user.role=='admin'||(S.user.perms||ROLES[S.user.role][1]).includes(t));
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('هەڵگرتن سەرکەوتوو نەبوو (شوێن پڕە)')}queueSync()}
const dlg=(h,t)=>g(t||'m').innerHTML=`<div class="ov"><div class="card dl">${h}</div></div>`;
const cls=t=>g(t||'m').innerHTML='';
const tb=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.join('')}</table></div>`;
const kp=(l,v,c)=>`<div class="kp ${c||''}"><small>${l}</small><b>${v}</b></div>`;
const fld=(id,l,v,t)=>`<label>${l}</label><input id="${id}" type="${t||'text'}" value="${esc(v)}">`;
const pr=h=>{g('prt').innerHTML=h;setTimeout(()=>window.print(),50)};

/* ---------- login / shell ---------- */
function login(){g('app').innerHTML=`<div class="card" style="max-width:340px;margin:12vh auto"><h2>🛒 ${esc(db.set.shop)}</h2><select id="lu">${db.users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select><input id="lp" type="password" placeholder="پینکۆد" onkeydown="event.key=='Enter'&&doLogin()"><button class="pri" style="width:100%;margin-top:6px" onclick="doLogin()">چوونەژوورەوە</button><small>یەکەم جار: بەڕێوەبەر / 1234 (دوای چوونەژوورەوە بیگۆڕە)</small></div>`}
function doLogin(){const u=db.users.find(u=>u.id==g('lu').value);if(u&&u.pin==g('lp').value){S.user=u;render()}else alert('پینکۆد هەڵەیە')}
function render(){if(!S.user)return login();const tabs=ALL.filter(can);if(!can(S.tab))S.tab=tabs[0];
g('app').innerHTML=`<header><b>🛒 ${esc(db.set.shop)}</b><span class="sp"></span><span class="badge">${navigator.onLine?'🟢 ئۆنلاین':'🟠 ئۆفڵاین'}${db.pend?' · چاوەڕێی سینک':''}</span><span>${esc(S.user.name)}</span><button onclick="S.user=null;render()">دەرچوون</button></header><nav>${tabs.map(t=>`<a class="${t==S.tab?'on':''}" onclick="S.tab='${t}';render()">${NAMES[t]}</a>`).join('')}</nav><main>${V[S.tab]()}</main>`}

/* ---------- barcode / OCR ---------- */
let stream,scanOn;
function stopScan(){scanOn=false;stream&&stream.getTracks().forEach(t=>t.stop());stream=null}
async function scan(cb){
 window._cb=c=>{stopScan();cls('m2');c&&cb(c)};
 dlg(`<h3>سکانی بارکۆد</h3><video id="vd" playsinline muted style="width:100%;border-radius:8px"></video><input id="mc" placeholder="یان بارکۆد بە دەست بنووسە" onkeydown="event.key=='Enter'&&_cb(val('mc'))"><div class="bar"><button class="pri" onclick="_cb(val('mc'))">باشە</button><button onclick="stopScan();cls('m2')">داخستن</button></div><small id="sm"></small>`,'m2');
 if(!('BarcodeDetector' in window)){g('sm').textContent='ئەم وێبگەڕە سکانی بارکۆد پشتیوانی ناکات (Chrome بەکاربهێنە) — بە دەست بنووسە';return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=g('vd');v.srcObject=stream;await v.play();const d=new BarcodeDetector();scanOn=true;
 while(scanOn){try{const r=await d.detect(v);if(r.length){window._cb(r[0].rawValue);return}}catch(e){}await new Promise(r=>setTimeout(r,250))}}
 catch(e){const s=g('sm');if(s)s.textContent='کامێرا نەکرایەوە — بە دەست بنووسە'}}
async function ocrFile(f){if(!f)return;const o=g('ot');o.value='چاوەڕێ بە...';
 try{if(!window.Tesseract)await new Promise((a,b)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=a;s.onerror=b;document.head.appendChild(s)});
 const r=await Tesseract.recognize(f,'eng');o.value=r.data.text;ocrMatch()}catch(e){o.value='OCR کار نەکرد (پێویستی بە ئینتەرنێت یان کۆپیی ڕاستەوخۆی فایلەکەیە). تێکستەکە بە دەست بنووسە.'}}
function ocrMatch(){const t=g('ot').value.toLowerCase();let n=0;db.products.forEach(p=>{if(((p.code&&t.includes(String(p.code).toLowerCase()))||t.includes(p.name.toLowerCase()))&&!S.pl.some(l=>l.pid==p.id)){S.pl.push({pid:p.id,qty:1,cost:p.cost});n++}});buyRefresh();alert(n+' کاڵا لە وەسڵەکە دۆزرایەوە')}

/* ---------- dashboard / calc ---------- */
const inR=(d,f,t)=>{d=d.slice(0,10);return d>=f&&d<=t};
function calc(f,t){const s=db.sales.filter(x=>inR(x.date,f,t)),rev=sum(s,net),cogs=sum(s,x=>sum(x.items,i=>i.qty*i.cost)),ex=sum(db.expenses.filter(e=>inR(e.date,f,t)),e=>e.amt);return{s,rev,cogs,gross:rev-cogs,ex,np:rev-cogs-ex,pur:sum(db.purchases.filter(p=>inR(p.date,f,t)),p=>p.total)}}
function grp(f,t,len){const o={},a=k=>o[k]=o[k]||{r:0,c:0,e:0,n:0};db.sales.filter(s=>inR(s.date,f,t)).forEach(s=>{const x=a(s.date.slice(0,len));x.r+=net(s);x.c+=sum(s.items,i=>i.qty*i.cost);x.n++});db.expenses.filter(e=>inR(e.date,f,t)).forEach(e=>a(e.date.slice(0,len)).e+=e.amt);return Object.entries(o).sort().reverse()}
V.dash=()=>{const t=today(),d=calc(t,t),m=calc(t.slice(0,8)+'01',t),low=db.products.filter(p=>p.qty<=p.min);
return `<div class="kps">${kp('فرۆشتنی ئەمڕۆ',money(d.rev))}${kp('قازانجی ئەمڕۆ (دوای خەرجی)',money(d.np),'g')}${kp('فرۆشتنی مانگ',money(m.rev))}${kp('قازانجی خاوێنی مانگ',money(m.np),'g')}${kp('قەرزی کڕیاران',money(sum(db.customers,c=>Math.max(0,custBal(c.id)))),'r')}${kp('قەرزی دابینکەران',money(sum(db.suppliers,c=>Math.max(0,supBal(c.id)))),'r')}${kp('نرخی کۆگا',money(sum(db.products,p=>p.qty*p.cost)))}${kp('کاڵای کەمبوو',low.length,'r')}</div><div class="card"><h3>⚠ کاڵای کەمبوو</h3>${low.length?tb(['کاڵا','ماوە','کەمترین'],low.map(p=>`<tr><td>${esc(p.name)}</td><td class="low">${p.qty}</td><td>${p.min}</td></tr>`)):'<p>هیچ کاڵایەک کەم نییە ✓</p>'}</div>`};

/* ---------- products ---------- */
function prodList(){const q=(S.pq||'').toLowerCase();return tb(['بارکۆد','ناو','نرخی کڕین','نرخی فرۆشتن','ژمارە',''],db.products.filter(p=>!q||(p.name+' '+p.code).toLowerCase().includes(q)).map(p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${fmt(p.cost)}</td><td>${fmt(p.price)}</td><td class="${p.qty<=p.min?'low':''}">${p.qty}</td><td><button onclick="prodForm(${p.id})">✏️</button> <button class="dng" onclick="delProd(${p.id})">🗑</button></td></tr>`))}
V.prod=()=>`<div class="card"><div class="bar"><input placeholder="گەڕان بە ناو یان بارکۆد" value="${esc(S.pq||'')}" oninput="S.pq=this.value;g('pl').innerHTML=prodList()"><button onclick="scan(c=>{S.pq=c;render()})">📷</button><button class="pri" onclick="prodForm()">+ کاڵای نوێ</button></div><div id="pl">${prodList()}</div></div>`;
function prodForm(i,code){const p=P(i)||{code:code||'',name:'',cost:0,price:0,qty:0,min:0};dlg(`<h3>${i?'دەستکاری':'زیادکردنی'} کاڵا</h3><label>بارکۆد</label><div class="bar"><input id="pc" value="${esc(p.code)}"><button onclick="scan(c=>g('pc').value=c)">📷</button></div>${fld('pn','ناو',p.name)}${fld('pcst','نرخی کڕین',p.cost,'number')}${fld('ppr','نرخی فرۆشتن',p.price,'number')}${fld('pq','ژمارەی کۆگا',p.qty,'number')}${fld('pm','کەمترین ژمارە (ئاگاداری)',p.min,'number')}<div class="bar" style="margin-top:10px"><button class="pri" onclick="saveProd(${i||0})">هەڵگرتن</button><button onclick="cls()">داخستن</button></div>`)}
function saveProd(i){const o={code:val('pc'),name:val('pn'),cost:num('pcst'),price:num('ppr'),qty:num('pq'),min:num('pm')};if(!o.name)return alert('ناو بنووسە');if(o.code&&db.products.some(p=>p.code==o.code&&p.id!=i))return alert('ئەم بارکۆدە پێشتر هەیە');i?Object.assign(P(i),o):db.products.push({id:nid(),...o});save();cls();render()}
function delProd(i){if(confirm('بسڕدرێتەوە؟')){db.products=db.products.filter(p=>p.id!=i);save();render()}}

/* ---------- POS ---------- */
const chips=q=>{q=(q||'').toLowerCase();return db.products.filter(p=>!q||(p.name+' '+p.code).toLowerCase().includes(q)).slice(0,12).map(p=>`<button onclick="addCart(${p.id})"><b>${esc(p.name)}</b><br><small>${fmt(p.price)} · ماوە ${p.qty}</small></button>`).join('')||'<small>کاڵا نەدۆزرایەوە</small>'};
V.pos=()=>`<div class="grid2"><div class="card"><div class="bar"><input id="ps" placeholder="بارکۆد یان ناو + Enter" onkeydown="if(event.key=='Enter')posAdd(this.value)" oninput="g('pf').innerHTML=chips(this.value)"><button onclick="scan(posAdd)">📷</button></div><div class="chips" id="pf">${chips('')}</div></div><div class="card" id="cart">${cartHtml()}</div></div>`;
function posAdd(v){v=String(v).trim();if(!v)return;let p=db.products.find(p=>p.code==v);if(!p){const m=db.products.filter(p=>p.name.toLowerCase().includes(v.toLowerCase()));if(m.length==1)p=m[0]}if(!p)return alert('کاڵا نەدۆزرایەوە');addCart(p.id);const s=g('ps');if(s){s.value='';g('pf').innerHTML=chips('')}}
function addCart(i){const l=S.cart.find(l=>l.pid==i),p=P(i);if(p.qty<=(l?l.qty:0))return alert('کۆگا بەس نییە');l?l.qty++:S.cart.push({pid:i,qty:1,price:p.price});g('cart').innerHTML=cartHtml()}
function cartTot(){const t=sum(S.cart,l=>l.qty*l.price),d=Math.min(+S.disc||0,t);return{t,d,n:t-d}}
function cartHtml(){const c=cartTot();return `<h3>🧾 وەسڵی فرۆشتن</h3>${S.cart.length?tb(['کاڵا','ژمارە','نرخ','کۆ',''],S.cart.map((l,i)=>`<tr><td>${esc(P(l.pid).name)}</td><td><input style="width:64px" type="number" min="1" value="${l.qty}" onchange="S.cart[${i}].qty=Math.max(1,+this.value||1);g('cart').innerHTML=cartHtml()"></td><td><input style="width:90px" type="number" value="${l.price}" onchange="S.cart[${i}].price=+this.value||0;g('cart').innerHTML=cartHtml()"></td><td>${fmt(l.qty*l.price)}</td><td><button onclick="S.cart.splice(${i},1);g('cart').innerHTML=cartHtml()">✕</button></td></tr>`)):'<p><small>سەبەتە بەتاڵە</small></p>'}
<label>داشکاندن</label><input type="number" value="${S.disc||''}" onchange="S.disc=+this.value;g('cart').innerHTML=cartHtml()">
<label>کڕیار (بۆ قەرز)</label><select onchange="S.cid=+this.value"><option value="0">— کڕیاری ئاسایی —</option>${db.customers.map(x=>`<option value="${x.id}" ${S.cid==x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
<label>بڕی دراو (بەتاڵ = هەمووی)</label><input type="number" value="${S.paid}" onchange="S.paid=this.value">
<label>ژمارەی قیستەکان (ئەگەر قەرز بوو)</label><input type="number" min="0" value="${S.inst||''}" onchange="S.inst=+this.value">
<h2>کۆی گشتی: ${money(c.n)}</h2><button class="pri" style="width:100%" onclick="checkout()" ${S.cart.length?'':'disabled'}>✔ تەواوکردن و چاپ</button>`}
function checkout(){const c=S.cart,{t,d,n}=cartTot();let paid=(S.paid===''||S.paid==null)?n:Math.min(Math.max(+S.paid,0),n);if(paid<n&&!S.cid)return alert('بۆ قەرز، کڕیار هەڵبژێرە');
for(const l of c)if(P(l.pid).qty<l.qty)return alert('کۆگا بەس نییە: '+P(l.pid).name);
const s={id:nid(),no:db.sales.length+1,date:tz(),cid:+S.cid||0,by:S.user.name,total:t,disc:d,paid,inst:paid<n?(+S.inst||0):0,items:c.map(l=>({pid:l.pid,name:P(l.pid).name,qty:l.qty,price:l.price,cost:P(l.pid).cost}))};
c.forEach(l=>P(l.pid).qty-=l.qty);db.sales.push(s);save();S.cart=[];S.disc=0;S.paid='';S.inst=0;render();printSale(s.id)}
function printSale(i){const s=db.sales.find(x=>x.id==i),c=C(s.cid);pr(`<div style="max-width:300px;margin:auto;direction:rtl"><h3 style="text-align:center">${esc(db.set.shop)}</h3><p>وەسڵ #${s.no}<br>${s.date.slice(0,16).replace('T',' ')}<br>${c?'کڕیار: '+esc(c.name)+'<br>':''}فرۆشیار: ${esc(s.by)}</p><table>${s.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}×${fmt(i.price)}</td><td>${fmt(i.qty*i.price)}</td></tr>`).join('')}</table><hr><p>کۆ: ${money(s.total)}<br>داشکاندن: ${money(s.disc)}<br><b>پێویست: ${money(net(s))}</b><br>دراو: ${money(s.paid)}<br>ماوە (قەرز): ${money(net(s)-s.paid)}</p><p style="text-align:center">سوپاس بۆ کڕینتان</p></div>`)}

/* ---------- purchases & suppliers ---------- */
V.buy=()=>`<div class="grid2"><div class="card"><h3>📦 دابینکەران</h3><button onclick="supForm()">+ دابینکەر</button>${tb(['ناو','تەلەفۆن','قەرز',''],db.suppliers.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.phone)}</td><td class="${supBal(s.id)>0?'low':''}">${fmt(supBal(s.id))}</td><td><button onclick="payDlg('s',${s.id})">پارەدان</button></td></tr>`))}</div>
<div class="card"><h3>➕ کڕینی نوێ</h3><select id="bs" onchange="S.psup=+this.value"><option value="0">— دابینکەر —</option>${db.suppliers.map(s=>`<option value="${s.id}" ${S.psup==s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
<div class="bar"><input id="bc" placeholder="بارکۆد یان ناوی کاڵا + Enter" onkeydown="if(event.key=='Enter')buyAdd(this.value)"><button onclick="scan(buyAdd)">📷</button></div>
<label>OCR — وێنەی وەسڵی کڕین</label><input type="file" accept="image/*" capture="environment" onchange="ocrFile(this.files[0])"><textarea id="ot" rows="3" placeholder="تێکستی وەسڵ لێرە دەردەکەوێت"></textarea><button onclick="ocrMatch()">شیکردنەوەی تێکست</button>
<div id="bl">${buyLines()}</div></div></div>
<div class="card"><h3>مێژووی کڕین</h3>${tb(['بەروار','دابینکەر','کۆ','دراو'],db.purchases.slice(-15).reverse().map(p=>`<tr><td>${p.date.slice(0,10)}</td><td>${esc((SP(p.sid)||{}).name||'—')}</td><td>${fmt(p.total)}</td><td>${fmt(p.paid)}</td></tr>`))}</div>`;
function buyAdd(v){v=String(v).trim();if(!v)return;let p=db.products.find(p=>p.code==v)||db.products.find(p=>p.name.toLowerCase()==v.toLowerCase());if(!p){if(confirm('کاڵا نەدۆزرایەوە. زیادی بکەم؟'))prodForm(0,v);return}if(!S.pl.some(l=>l.pid==p.id))S.pl.push({pid:p.id,qty:1,cost:p.cost});buyRefresh();const b=g('bc');if(b)b.value=''}
function buyRefresh(){const b=g('bl');if(b)b.innerHTML=buyLines()}
function buyLines(){const t=sum(S.pl,l=>l.qty*l.cost);return (S.pl.length?tb(['کاڵا','ژمارە','نرخی کڕین','کۆ',''],S.pl.map((l,i)=>`<tr><td>${esc(P(l.pid).name)}</td><td><input style="width:64px" type="number" value="${l.qty}" onchange="S.pl[${i}].qty=+this.value||1;buyRefresh()"></td><td><input style="width:90px" type="number" value="${l.cost}" onchange="S.pl[${i}].cost=+this.value||0;buyRefresh()"></td><td>${fmt(l.qty*l.cost)}</td><td><button onclick="S.pl.splice(${i},1);buyRefresh()">✕</button></td></tr>`)):'')+`<h3>کۆ: ${money(t)}</h3><label>بڕی دراو (بەتاڵ = هەمووی)</label><input id="bp" type="number"><button class="pri" style="width:100%" onclick="savePur()">✔ پاشەکەوتکردن و زیادکردن بۆ کۆگا</button>`}
function savePur(){if(!S.pl.length)return alert('کاڵا زیاد بکە');const t=sum(S.pl,l=>l.qty*l.cost),pv=g('bp').value,paid=pv===''?t:Math.min(+pv,t);if(paid<t&&!S.psup)return alert('بۆ قەرز، دابینکەر هەڵبژێرە');
S.pl.forEach(l=>{const p=P(l.pid);p.qty+=l.qty;p.cost=l.cost});db.purchases.push({id:nid(),date:tz(),sid:S.psup,total:t,paid,items:S.pl.map(l=>({pid:l.pid,qty:l.qty,cost:l.cost}))});S.pl=[];save();render()}
function supForm(){dlg(`<h3>دابینکەری نوێ</h3>${fld('sn','ناو','')}${fld('sph','تەلەفۆن','')}<div class="bar" style="margin-top:10px"><button class="pri" onclick="if(!val('sn'))return;db.suppliers.push({id:nid(),name:val('sn'),phone:val('sph')});save();cls();render()">هەڵگرتن</button><button onclick="cls()">داخستن</button></div>`)}

/* ---------- customers / debts / installments ---------- */
V.cust=()=>`<div class="card"><div class="bar"><button class="pri" onclick="custForm()">+ کڕیار</button></div>${tb(['ناو','تەلەفۆن','قەرز',''],db.customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td class="${custBal(c.id)>0?'low':''}">${fmt(custBal(c.id))}</td><td><button onclick="payDlg('c',${c.id})">دانەوەی قەرز</button> <button onclick="stmt(${c.id})">کەشف / قیست</button></td></tr>`))}</div>`;
function custForm(){dlg(`<h3>کڕیاری نوێ</h3>${fld('cn','ناو','')}${fld('cph','تەلەفۆن','')}<div class="bar" style="margin-top:10px"><button class="pri" onclick="if(!val('cn'))return;db.customers.push({id:nid(),name:val('cn'),phone:val('cph')});save();cls();render()">هەڵگرتن</button><button onclick="cls()">داخستن</button></div>`)}
function payDlg(k,o){const n=k=='c'?C(o).name:SP(o).name,b=k=='c'?custBal(o):supBal(o);dlg(`<h3>پارەدان — ${esc(n)}</h3><p>قەرزی ماوە: <b>${money(b)}</b></p>${fld('pa','بڕ',b>0?b:'','number')}<div class="bar" style="margin-top:10px"><button class="pri" onclick="const a=num('pa');if(a<=0)return;db.payments.push({id:nid(),k:'${k}',o:${o},amt:a,date:tz()});save();cls();render()">هەڵگرتن</button><button onclick="cls()">داخستن</button></div>`)}
function stmt(i){const c=C(i),pl=db.sales.filter(s=>s.cid==i&&s.inst>0&&net(s)>s.paid).map(s=>{const rem=net(s)-s.paid,m=Math.ceil(rem/s.inst),d=new Date(s.date);return `<p><b>وەسڵ #${s.no}</b>: ${s.inst} قیست × ${fmt(m)}<br><small>${Array.from({length:s.inst},(_,k)=>{const x=new Date(d);x.setMonth(x.getMonth()+k+1);return x.toISOString().slice(0,10)}).join(' · ')}</small></p>`}).join('');
dlg(`<h3>${esc(c.name)}</h3><p>قەرزی ماوە: <b>${money(custBal(i))}</b></p><h4>قیستەکان</h4>${pl||'<small>هیچ پلانی قیست نییە</small>'}<h4>پارەدانەکان</h4>${tb(['بەروار','بڕ'],db.payments.filter(p=>p.k=='c'&&p.o==i).map(p=>`<tr><td>${p.date.slice(0,10)}</td><td>${fmt(p.amt)}</td></tr>`))}<button onclick="cls()" style="margin-top:8px">داخستن</button>`)}

/* ---------- expenses ---------- */
V.exp=()=>`<div class="card"><div class="bar"><input id="et" placeholder="باسی خەرجی (کرێ، کارەبا...)"><input id="ea" type="number" placeholder="بڕ"><input id="ed" type="date" value="${today()}"><button class="pri" onclick="addExp()">+ زیادکردن</button></div>${tb(['بەروار','باس','بڕ',''],db.expenses.slice().reverse().map(e=>`<tr><td>${e.date.slice(0,10)}</td><td>${esc(e.title)}</td><td>${fmt(e.amt)}</td><td><button class="dng" onclick="db.expenses=db.expenses.filter(x=>x.id!=${e.id});save();render()">🗑</button></td></tr>`))}</div>`;
function addExp(){if(!val('et')||num('ea')<=0)return alert('زانیاری تەواو بکە');db.expenses.push({id:nid(),title:val('et'),amt:num('ea'),date:val('ed')||today()});save();render()}

/* ---------- reports ---------- */
V.rep=()=>{S.f=S.f||today().slice(0,8)+'01';S.t=S.t||today();return `<div class="card"><div class="bar">لە <input type="date" value="${S.f}" onchange="S.f=this.value;g('rp').innerHTML=repHtml()"> بۆ <input type="date" value="${S.t}" onchange="S.t=this.value;g('rp').innerHTML=repHtml()"><button class="pri" onclick="pr(g('rp').innerHTML)">🖨 چاپی ڕاپۆرت</button></div></div><div id="rp">${repHtml()}</div>`};
function repHtml(){const c=calc(S.f,S.t),top={};c.s.forEach(s=>s.items.forEach(i=>{const x=top[i.name]=top[i.name]||{q:0,p:0};x.q+=i.qty;x.p+=i.qty*(i.price-i.cost)}));
const rows=(a)=>a.map(([k,x])=>`<tr><td>${k}</td><td>${x.n}</td><td>${fmt(x.r)}</td><td>${fmt(x.r-x.c)}</td><td>${fmt(x.e)}</td><td>${fmt(x.r-x.c-x.e)}</td></tr>`),H=['بەروار','وەسڵ','فرۆشتن','قازانجی گشتی','خەرجی','قازانجی خاوێن'];
return `<h3>${esc(db.set.shop)} — ڕاپۆرت ${S.f} → ${S.t}</h3><div class="kps">${kp('فرۆشتن',money(c.rev))}${kp('نرخی کڕینی فرۆشراو',money(c.cogs))}${kp('قازانجی گشتی',money(c.gross),'g')}${kp('خەرجی',money(c.ex))}${kp('قازانجی خاوێن',money(c.np),'g')}${kp('کڕین',money(c.pur))}</div>
<div class="card"><h4>کورتەی ڕۆژانە</h4>${tb(H,rows(grp(S.f,S.t,10)))}</div><div class="card"><h4>کورتەی مانگانە</h4>${tb(['مانگ'].concat(H.slice(1)),rows(grp('0000-01-01','9999-12-31',7)))}</div>
<div class="card"><h4>باشترین کاڵاکان</h4>${tb(['کاڵا','ژمارە','قازانج'],Object.entries(top).sort((a,b)=>b[1].p-a[1].p).slice(0,10).map(([n,x])=>`<tr><td>${esc(n)}</td><td>${x.q}</td><td>${fmt(x.p)}</td></tr>`))}</div>
<div class="card noprt"><h4>وەسڵەکانی فرۆشتن</h4>${tb(['#','بەروار','کۆ','قەرز',''],c.s.slice().reverse().slice(0,30).map(s=>`<tr><td>${s.no}</td><td>${s.date.slice(0,16).replace('T',' ')}</td><td>${fmt(net(s))}</td><td>${fmt(net(s)-s.paid)}</td><td><button onclick="printSale(${s.id})">🖨</button></td></tr>`))}</div>`}

/* ---------- users ---------- */
V.usr=()=>`<div class="card"><button class="pri" onclick="userForm()">+ کارمەند</button>${tb(['ناو','ڕۆڵ','دەسەڵات',''],db.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${ROLES[u.role][0]}</td><td><small>${(u.role=='admin'?ALL:u.perms||ROLES[u.role][1]).map(t=>NAMES[t]).join('، ')}</small></td><td><button onclick="userForm(${u.id})">✏️</button> ${u.id!=S.user.id?`<button class="dng" onclick="if(confirm('بسڕدرێتەوە؟')){db.users=db.users.filter(x=>x.id!=${u.id});save();render()}">🗑</button>`:''}</td></tr>`))}</div>`;
function userForm(i){const u=db.users.find(x=>x.id==i)||{name:'',pin:'',role:'cashier'},ps=u.role=='admin'?ALL:u.perms||ROLES[u.role][1];
dlg(`<h3>کارمەند</h3>${fld('un','ناو',u.name)}${fld('up','پینکۆد',u.pin)}<label>ڕۆڵ</label><select id="ur" onchange="const r=ROLES[this.value][1];document.querySelectorAll('.pm').forEach(x=>x.checked=r.includes(x.value))">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${u.role==k?'selected':''}>${v[0]}</option>`).join('')}</select><label>دەسەڵاتەکان</label>${ALL.map(t=>`<label style="display:inline-block;margin-inline-end:10px"><input class="pm" type="checkbox" style="width:auto" value="${t}" ${ps.includes(t)?'checked':''}> ${NAMES[t]}</label>`).join('')}<div class="bar" style="margin-top:10px"><button class="pri" onclick="saveUser(${i||0})">هەڵگرتن</button><button onclick="cls()">داخستن</button></div>`)}
function saveUser(i){const o={name:val('un'),pin:val('up'),role:val('ur'),perms:[...document.querySelectorAll('.pm:checked')].map(x=>x.value)};if(!o.name||!o.pin)return alert('ناو و پینکۆد پێویستە');if(i)Object.assign(db.users.find(x=>x.id==i),o);else db.users.push({id:nid(),...o});if(!db.users.some(u=>u.role=='admin'))return alert('دەبێت بەڕێوەبەرێک هەبێت');save();cls();render()}

/* ---------- settings / backup / sync ---------- */
V.set=()=>`<div class="grid2"><div class="card"><h3>⚙ گشتی</h3>${fld('ss','ناوی دوکان',db.set.shop)}${fld('sc','دراو',db.set.cur)}${fld('sy','ناونیشانی سینک (ئارەزوومەندانە)',db.set.sync)}<small>ئەگەر ناونیشانێک بنووسیت، لە کاتی گەڕانەوەی ئینتەرنێت داتا بە POST دەنێردرێت.</small><br><button class="pri" onclick="db.set={shop:val('ss')||'ARDUEXEL BUSINESS',cur:val('sc')||'IQD',sync:val('sy')};save();render()">هەڵگرتن</button> <button onclick="syncNow(1)">☁ ناردن بۆ Firebase</button> <button onclick="cloudPull()">⬇ هێنان لە Firebase</button></div>
<div class="card"><h3>💾 باکئەپ و گەڕاندنەوە</h3><p><small>هەموو داتا لەسەر ئامێرەکەتە و بەبێ ئینتەرنێت کار دەکات. باکئەپ بە بەردەوامی بگرە.</small></p><button class="pri" onclick="backup()">⬇ داگرتنی باکئەپ</button><label>گەڕاندنەوە لە فایلی باکئەپ</label><input type="file" accept=".json" onchange="restore(this.files[0])"><br><br><button class="dng" onclick="if(confirm('هەموو داتا دەسڕدرێتەوە!')&&confirm('دڵنیای؟')){localStorage.removeItem(K);location.reload()}">🗑 سڕینەوەی هەموو داتا</button></div></div>`;
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='arduexel-backup-'+today()+'.json';a.click()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products||!d.users)throw 0;if(!confirm('داتای ئێستا دەگۆڕدرێت. بەردەوام؟'))return;db=d;save();S.user=null;render()}catch(e){alert('فایلی باکئەپ دروست نییە')}};r.readAsText(f)}
let st;function queueSync(){clearTimeout(st);if(!db.set.sync&&!window.cloud)return;if(navigator.onLine)st=setTimeout(syncNow,3000);else db.pend=1}
async function syncNow(m){if(window.cloud){try{await cloud.push();db.pend=0;localStorage.setItem(K,JSON.stringify(db));if(m)alert('داتا بۆ Firebase نێردرا ✓')}catch(e){db.pend=1;if(m)alert('Firebase: '+e.message)}return}if(!db.set.sync){if(m)alert('ناونیشانی سینک نەنووسراوە');return}try{const r=await fetch(db.set.sync,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(db)});if(!r.ok)throw 0;db.pend=0;localStorage.setItem(K,JSON.stringify(db));if(m)alert('سینک سەرکەوتوو بوو')}catch(e){db.pend=1;if(m)alert('سینک سەرکەوتوو نەبوو')}}
addEventListener('online',()=>{S.user&&render();if(db.pend)syncNow()});addEventListener('offline',()=>S.user&&render());
render();
const CK=['products','suppliers','customers','sales','purchases','expenses','payments','users'];
async function cloudPull(){if(!window.cloud)return alert('Firebase ئامادە نییە (ئینتەرنێت پێویستە)');if(!confirm('داتای ئەم ئامێرە بە داتای Firebase دەگۆڕدرێت. بەردەوام؟'))return;
try{const o=await cloud.pull();if(!o.products)return alert('هیچ داتایەک لە Firebase نییە');CK.forEach(k=>{if(o[k])db[k]=JSON.parse(o[k].data)});if(o.meta){const m=JSON.parse(o.meta.data);db.set=Object.assign(db.set,m.set);db.seq=Math.max(db.seq,m.seq)}save();S.user=null;render();alert('داتا هێنرا ✓')}catch(e){alert('Firebase: '+e.message)}}
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,setDoc,getDocs,collection} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCuf_6tebOLgddWUsWjuz-QAY5zCRQDhxc",authDomain:"smart-attendance-system-db51a.firebaseapp.com",projectId:"smart-attendance-system-db51a",storageBucket:"smart-attendance-system-db51a.firebasestorage.app",messagingSenderId:"293108861060",appId:"1:293108861060:web:001a4e56d1e04c756b1ad1"});
const fs=getFirestore(app),COL='arduexel_business';
window.cloud={
 async push(){const u=tz();await Promise.all([...CK.map(k=>setDoc(doc(fs,COL,k),{data:JSON.stringify(db[k]),updated:u})),setDoc(doc(fs,COL,'meta'),{data:JSON.stringify({set:db.set,seq:db.seq}),updated:u})])},
 async pull(){const r=await getDocs(collection(fs,COL)),o={};r.forEach(d=>o[d.id]=d.data());return o}
};
if(db.pend&&navigator.onLine)syncNow();
</script></body></html>
